name: Build & Release APK
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: npm ci
      - name: Build APK
        run: eas build --platform android --profile preview --wait --non-interactive
      - name: Fetch APK URL
        id: apk
        run: |
          URL=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          curl -L "$URL" -o perduitan.apk
          echo "path=perduitan.apk" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: perduitan.apk
          generate_release_notes: true
